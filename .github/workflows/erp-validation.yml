name: ERP validation
on:
  push:
    branches: [erp-phase-0-6]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate ERP shell and PWA configuration
        run: node scripts/validate-erp.mjs
